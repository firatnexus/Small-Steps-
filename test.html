<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minik Adımlar — Testler</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f7f2; --card: #fff; --ink: #20312b; --muted: #68766f;
    --green: #267354; --green-dark: #1c5c41;
    --red: #a13e3e; --red-soft: #fdeceb;
    --ok-soft: #e6f4ec; --line: #e3eae4;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 80px;
    background: radial-gradient(ellipse at 10% 0%, #e7f2e8 0, transparent 36rem), var(--bg);
    color: var(--ink);
    font-size: 15px; line-height: 1.55;
  }
  .wrap { width: min(100%, 780px); margin: 0 auto; }
  h1 { margin: 0 0 8px; font-size: 1.9rem; letter-spacing: -.03em; }
  .lead { color: var(--muted); margin: 0 0 24px; }

  .summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    margin-bottom: 20px;
  }
  .summary > div {
    padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--card);
  }
  .summary .label { font-size: .78rem; font-weight: 700; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted); }
  .summary .value { font-size: 1.6rem; font-weight: 760; letter-spacing: -.04em; margin-top: 4px; }
  .summary .value.pass { color: var(--green); }
  .summary .value.fail { color: var(--red); }

  .bar {
    height: 6px; border-radius: 999px; background: #e6ede7; overflow: hidden;
    margin: 0 0 22px;
  }
  .bar > div { height: 100%; background: var(--green); transition: width .4s ease; }

  ul.tests { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li.test {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 10px 12px; border-radius: 10px; background: var(--card); border: 1px solid var(--line);
  }
  li.test.pass { border-color: #cfe6d6; background: var(--ok-soft); }
  li.test.fail { border-color: #e9c5c5; background: var(--red-soft); }
  .mark { flex: none; font-weight: 800; font-size: 1rem; line-height: 1.4; }
  .mark.pass { color: var(--green); }
  .mark.fail { color: var(--red); }
  .msg { flex: 1; }
  .msg .title { font-weight: 650; }
  .msg .details { font-size: .85rem; color: var(--muted); margin-top: 2px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: pre-wrap; }

  .actions { display: flex; gap: 10px; margin-top: 24px; }
  button {
    padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font-weight: 650; cursor: pointer;
  }
  button:hover { background: #f7faf7; }
  button.primary { background: var(--green); color: #fff; border-color: var(--green); }
  button.primary:hover { background: var(--green-dark); }

  @media (max-width: 560px) {
    .summary { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>🧪 Minik Adımlar — Testler</h1>
  <p class="lead">i18n motoru ve çeviri bütünlüğü için tarayıcı testleri.</p>

  <div class="summary" id="summary"></div>
  <div class="bar"><div id="bar" style="width:0%"></div></div>

  <ul class="tests" id="results"></ul>

  <div class="actions">
    <button class="primary" onclick="location.reload()">🔄 Yeniden çalıştır</button>
    <button onclick="history.length && history.back()">← Uygulamaya dön</button>
  </div>
</main>

<script src="translations.js"></script>
